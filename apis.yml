aid: nscale
url: https://raw.githubusercontent.com/api-evangelist/nscale/refs/heads/main/apis.yml
name: Nscale
kind: company
description: Nscale is an AI/GPU cloud that pairs serverless, OpenAI-compatible inference
  with on-demand GPU compute. The Serverless Inference API serves open models (Llama,
  Qwen, DeepSeek, GPT OSS, Mistral, Flux) at https://inference.api.nscale.com/v1 with
  pay-per-token billing, while the platform API provisions GPU clusters, compute instances,
  networks, and storage.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- GPU
- Inference
- Serverless
- Cloud Compute
