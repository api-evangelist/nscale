description: >-
  Nscale uses pay-as-you-go pricing. Serverless inference text models are
  billed per 1M tokens (input and output) and image models per megapixel based
  on resolution and diffusion steps. GPU compute (clusters, nodes, instances)
  is billed per GPU-hour, with reserved and enterprise commitments available
  via sales. New accounts receive a small free inference credit.
notes: >-
  Representative serverless rates are published on the Nscale pricing and
  serverless product pages; per-model rates and per-GPU-hour figures change
  frequently and were not all individually confirmed (reconciled false). Verify
  against nscale.com/pricing and the console at reconciliation.
